name: Déploiement Cloudflare (front Next.js + API)

on:
  push:
    branches: [main]

jobs:
  deploy-front:
    name: Front Next.js — Cloudflare Pages (arsenal-tools)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build (export statique)
        run: npm run build

      - name: Déployer out/ sur arsenal-tools.pages.dev
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out --project-name=arsenal-tools --branch=main --commit-dirty=true

  deploy-api:
    name: API — Worker (si backend modifié)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Détecter les changements du backend
        id: changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -qE '^(worker/|src/lib/server/|migrations/|wrangler-api\.jsonc)'; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Déployer le Worker arsenal-api
        if: steps.changes.outputs.changed == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy -c wrangler-api.jsonc
